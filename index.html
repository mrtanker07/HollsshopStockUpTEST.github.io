  e.items.forEach(function (i) { if (i.applied) { if (i.key === 'loyal') dA += i.amount; else dP += i.amount; } });
  dA = Math.round(Math.min(dA, sub)); dP = Math.round(Math.min(dP + oGiftSum(), Math.max(0, sub - dA)));
  var left = Math.max(0, sub - dA - dP);
  (O.man || []).forEach(function (m) {
    var v = Number(m.value), a = v > 0 ? Math.round(m.kind === 'pct' ? sub * v / 100 : v) : 0;
    a = Math.min(a, left); left -= a; dM += a;

// Автоматические скидки: постоянный клиент, скидка за отзыв, акции. Один и тот же код в Code.gs и в index.html.
function promoHit(p, l) {
  var sc = p.scope, cat = String(l.category || '').toLowerCase(), lc = function (a) { return (a || []).map(function (c) { return String(c).toLowerCase(); }); };
  if (!sc) {
    var c0 = String(p.category || '').toLowerCase(), sk = String(p.skus || '').toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    return (!c0 && !sk.length) || (c0 && cat === c0) || (sk.length && sk.indexOf(String(l.sku || '').toLowerCase()) >= 0);
  }
  if (sc.mode === 'cats') return lc(sc.cats).indexOf(cat) >= 0;
  if (sc.mode === 'catsExcept') return lc(sc.cats).indexOf(cat) < 0;
  if (sc.mode === 'prods') return (sc.prods || []).indexOf(String(l.pid)) >= 0;
  if (sc.mode === 'prodsExcept') return (sc.prods || []).indexOf(String(l.pid)) < 0;
  return true;
}
function autoDisc(x) {
  var r2 = function (v) { return Math.round(v); }, sub = 0, items = []; // суммы заказов округляются до целых
  x.lines.forEach(function (l) { sub += l.qty * l.price; });
  if (x.pct > 0 && sub > 0) {
    var lsum = x.pctKind === 'sum', lam = r2(lsum ? Math.min(x.pct, sub) : sub * x.pct / 100);
    items.push({ key: 'loyal', type: 'loyal', name: 'Постоянный клиент −' + (lsum ? lam + ' грн' : x.pct + '%'), amount: lam });
  }
  if (x.reviewOk && x.reviewAmt > 0 && sub > 0) items.push({ key: 'review', type: 'review', name: 'Скидка за отзыв',
    amount: r2(x.reviewKind === 'pct' ? sub * Math.min(x.reviewAmt, 100) / 100 : Math.min(x.reviewAmt, sub)) });
  (x.promos || []).forEach(function (p) {
    if (p.kind === 'gift') return; // «Подарок» выбирается в заказе вручную
    if ((p.dateFrom && x.today < p.dateFrom) || (p.dateTo && x.today > p.dateTo)) return;
    var qq = 0, qs = 0;
    x.lines.forEach(function (l) {
      if (promoHit(p, l)) { qq += l.qty; qs += l.qty * l.price; }
    });
    if (qs <= 0 || qq < (Number(p.minQty) || 1)) return;
    items.push({ key: 'promo:' + p.id, type: 'promo', name: 'Акция «' + p.name + '»', stack: !!p.stack,
                 amount: r2(p.kind === 'sum' ? Math.min(p.value, qs) : qs * p.value / 100) });
  });
  var off = x.off || [], best = null;
  items.forEach(function (it) {
    it.applied = true; it.note = '';
    if (off.indexOf(it.key) >= 0) { it.applied = false; it.off = true; it.note = 'снята'; }
  });
  items.forEach(function (it) { if (it.type === 'promo' && it.applied && (!best || it.amount > best.amount)) best = it; });
  items.forEach(function (it) { if (it.type === 'promo' && it.applied && it !== best) { it.applied = false; it.note = 'применена более выгодная акция'; } });
  if (best && !best.stack) {
    var others = items.filter(function (it) { return it.type !== 'promo' && it.applied; }), os = 0;
    others.forEach(function (it) { os += it.amount; });
    if (others.length) {
      if (best.amount >= os) others.forEach(function (it) { it.applied = false; it.note = 'не совмещается с акцией'; });
      else { best.applied = false; best.note = 'не совмещается с другими скидками'; }
    }
  }
  var auto = 0;
  items.forEach(function (it) { if (it.applied) auto += it.amount; });
  return { sub: r2(sub), items: items, auto: r2(Math.min(auto, sub)) };
}

function ico(n) {
  return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
}
function status(q, min) {
  if (q === 0) return ['no', 'circle-x', 'Нет в наличии'];
  if (min != null && !isNaN(min) && q > 0 && q <= min) return ['low', 'alert-triangle', 'Заканчивается'];
  return ['ok', 'circle-check', 'В наличии'];
}
function badge(q, min) { var s = status(q, min); return '<span class="bdg ' + s[0] + '">' + ico(s[1]) + s[2] + '</span>'; }
function qtyBox(q) { return '<span class="qty' + (q >= 1000 ? ' qs' : '') + '">' + q + ' <small>шт</small></span>'; }
function vlabel(v) {
  return v.value === 'Без вариации' ? '<b>Без вариации</b>' : (v.vartype ? esc(v.vartype) + ' ' : '') + '<b>' + esc(v.value) + '</b>';
}
function priceHtml(p) {
  return p.price > 0 ? '<span class="pc-price">' + money(p.price) + '</span>' : '<span class="pc-price mu">Цена не задана</span>';
}
function prank(p) {
  var vs = p.vars.filter(function (v) { return !v.archived; });
  if (!vs.length) return 0;
  return Math.min.apply(null, vs.map(function (v) { return {no: 0, low: 1, ok: 2}[status(v.stock, p.min)[0]]; }));
}
function sortItems(items) {
  var s = S.sort, nm = function (a, b) { return String(a.name).localeCompare(String(b.name), LOC()); };
  return items.slice().sort(function (a, b) {
    if (s === 'name') return nm(a, b);
    if (s === 'name-d') return nm(b, a);
    if (s === 'new') return S.products.indexOf(b) - S.products.indexOf(a); // строки в таблице идут по порядку создания
    var d = prank(a) - prank(b);
    if (s === 'st-d') d = -d;
    return d || nm(a, b);
  });
}

function cardHtml(p) {
  var vs = p.vars.filter(function (v) { return !v.archived; });
  var single = !vs.length || (vs.length === 1 && vs[0].value === 'Без вариации');
  var meta = [p.category, p.material, p.sku ? '#' + p.sku : ''].filter(Boolean).join(' · ');
  var mn = p.archived
    ? [['resP', 'Восстановить'], ['delP', 'Удалить навсегда', 'dg']]
    : [['editP', 'Редактировать'], ['minP', 'Изменить минимальный остаток']].concat(single ? [] : [['varsP', 'Изменить вариации']], [['arcP', 'В архив']]);
  var photo = '<div class="pc-photo"' + (p.archived && !p.photo ? '' : ' role="button" tabindex="0" aria-label="' + (p.photo ? 'Увеличить фото' : 'Добавить фото') + '" data-a="' + (p.photo ? 'zoomP' : 'addPhoto') + '" data-id="' + esc(p.id) + '"') + '>' +
    (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : ico('photo')) + '</div>';
  var head = photo + '<div class="pc-main"><p class="pc-name" title="' + esc(p.name) + '">' + esc(p.name) + '</p>' +
    (meta ? '<p class="pc-meta">' + esc(meta) + '</p>' : '') + '</div>';
  var m = menu(mn, p.id, ico('dots')), price = priceHtml(p), sg = function (c, x) { return '<div class="sg ' + c + '">' + x + '</div>'; };
  if (single) {
    var q = vs.length ? vs[0].stock : 0;
    return '<div class="pc single"><div class="pc-head">' + head + sg('sp', price) + '<div class="stock-row">' + sg('sq', qtyBox(q)) + sg('ss', badge(q, p.min)) + '</div>' + sg('so', m) + '</div></div>';
  }
  var tot = vs.reduce(function (a, v) { return a + v.stock; }, 0);
  var nl = vs.filter(function (v) { return status(v.stock, p.min)[0] !== 'ok'; }).length;
  var ag = tot === 0 ? ['no', 'circle-x', 'Нет в наличии']
    : vs.some(function (v) { return status(v.stock, p.min)[0] !== 'ok'; }) ? ['low', 'alert-triangle', 'Заканчивается'] : ['ok', 'circle-check', 'В наличии'];
  return '<div class="pc"><div class="pc-head">' + head + sg('sp', price) + sg('sq sa', qtyBox(tot)) +
    sg('ss sa', '<span class="bdg ' + ag[0] + '" title="Итог по всем вариациям">' + ico(ag[1]) + ag[2] + (ag[0] === 'low' ? ' · ' + nl + ' поз.' : '') + '</span>') + sg('so', m) + '</div><div class="pc-vars">' + vs.map(function (v) {
    return '<div class="pc-var"><div class="pc-vrow"><span class="vl">' + vlabel(v) + '</span>' + qtyBox(v.stock) + '</div>' + badge(v.stock, p.min) + '</div>';
  }).join('') + '</div></div>';
}

function plist() {
  var q = S.q.trim().toLowerCase();
  var items = S.products.filter(function (p) {
    if (!!p.archived !== (S.tab === 'arc')) return false;
    if (S.cat && p.category !== S.cat) return false;
    if (S.tab === 'no' || S.tab === 'low') {
      var want = S.tab;
      if (!p.vars.some(function (v) { return !v.archived && status(v.stock, p.min)[0] === want; })) return false;
    }
    return !q || (p.name + ' ' + p.sku).toLowerCase().indexOf(q) >= 0;
  });
  if (!items.length) return '<p class="mu">' + (S.products.length ? 'Ничего не найдено.' : 'Товаров пока нет. Нажмите «Новый товар».') + '</p>';
  return sortItems(items).map(cardHtml).join('');
}

var SORTS = [['name', 'По названию: А → Я'], ['name-d', 'По названию: Я → А'], ['new', 'Сначала новые товары'], ['st', 'По статусу: сначала нет в наличии'], ['st-d', 'По статусу: сначала в наличии']];
function filtOn() { return S.sort !== 'name' || S.tab === 'no' || S.tab === 'low' || !!S.cat; }
function syncReset() { document.querySelectorAll('[data-a="resetF"]').forEach(function (b) { b.disabled = !filtOn(); }); }
var STATS = [['all', 'Все'], ['no', 'Нет в наличии'], ['low', 'Заканчивается']];

function catNames() {
  var list = dn('category');
  S.products.forEach(function (p) { if (p.category && list.indexOf(p.category) < 0) list.push(p.category); });
  return list;
}
// на телефоне под кнопкой «Фильтр»: что выбрано и «Сбросить»
function filtSummary() {
  if (!filtOn()) return '';
  var parts = [];
  if (S.tab === 'no') parts.push('Нет в наличии'); else if (S.tab === 'low') parts.push('Заканчивается');
  if (S.cat) parts.push(S.cat);

  return '<div class="fsm"><span>Выбрано: <b>' + esc(parts.join(' · ')) + '</b></span><button class="ghost dg" data-a="resetF">Сбросить</button></div>';
}
function catsHtml() {

  return '<div class="chips cats fl-d"><button class="' + (S.cat ? '' : 'on') + '" data-a="cat" data-k="">Все категории</button>' + list.map(function (c) {
    return '<button class="' + (S.cat === c ? 'on' : '') + '" data-a="cat" data-k="' + esc(c) + '">' + esc(c) + '</button>';

function productsPage() {

function docHtml(doc, lines) {

  var tbl;

      return '<tr><td>' + esc(l.label) + '</td><td class="r">' + (l.oldPrice > 0 ? money(l.oldPrice) : '—') + '</td><td class="r"><b>' + money(l.price) + '</b></td></tr>';

}
// строки документа не меняются после проведения, поэтому запоминаем их
function docLines(id, silent) {

// ---------- создание документа ----------

function activeVars(p) { return p.vars.filter(function (v) { return !v.archived; }); }
function needVar(p) { var a = activeVars(p); return !(a.length === 1 && a[0].value === 'Без вариации'); }
function vname(v) { return v.value === 'Без вариации' ? 'Без вариации' : (v.vartype ? v.vartype + ' ' : '') + v.value; }
function lineLabel(l) {
  var p = prod(l.pid), v = p && p.vars.filter(function (x) { return x.id === l.vid; })[0];
  return p ? p.name + (v && v.value !== 'Без вариации' ? ', ' + vname(v) : '') : 'Товар удален';
}
// Открыть окно без перехода фокуса на первое поле ввода
function openD(d) { d.tabIndex = -1; document.body.appendChild(d); d.showModal(); d.focus(); }
function dlg() { return document.getElementById('ddlg'); }
function dfix() {
  var p = prod(D.pid);
  if (!p) { D.pid = ''; D.vid = ''; return; }
  var a = activeVars(p);
  if (!needVar(p)) D.vid = a[0] ? a[0].id : '';
  else if (!a.some(function (v) { return v.id === D.vid; })) D.vid = '';
}
function pbtn() {
  return D.pid
    ? '<button type="button" class="warn" data-a="dEditP">Изменить товар</button>'
    : '<button type="button" class="okb" data-a="dNewP">Создать товар</button>';
}
function sugHtml() {
  var q = D.q.trim(), pr = D.type === 'pricing';
  if (!q || (!pr && D.pid)) return '';
  var m = S.products.filter(function (p) {
    return !p.archived && pmatch(p, q) && (!pr || !D.plines.some(function (l) { return l.pid === p.id; }));
  }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name), LOC()); }).slice(0, 10);
  if (!m.length) return '<div class="sug"><p class="mu" style="margin:0;padding:10px 12px">Ничего не найдено.' + (D.type === 'receipt' ? ' Товар можно создать кнопкой сверху.' : '') + '</p></div>';
  return '<div class="sug">' + m.map(function (p) {
    return '<button type="button" data-a="' + (pr ? 'pAdd' : 'dPick') + '" data-id="' + esc(p.id) + '">' + esc(p.name) + '<span class="mu">' +
      esc([p.category, p.sku ? '#' + p.sku : ''].filter(Boolean).join(' · ')) + '</span></button>';
  }).join('') + '</div>';
}
function varHtml() {
  var p = prod(D.pid);
  if (!p || !needVar(p)) return '';
  return '<label>Вариация</label><select data-p="vid"><option value="">Выберите</option>' +
    opts(activeVars(p).map(function (v) { return [v.id, vname(v) + ' — ' + v.stock + ' шт']; }), D.vid) + '</select>';
}
function linesHtml() {
  var rc = D.type === 'receipt', ad = D.type === 'adjust';
  if (!D.lines.length) return '<p class="mu">Список пуст. Выберите товар выше и нажмите «Добавить».</p>';
  return D.lines.map(function (l, i) {
    var q = Number(l.qty) || 0, pr = Number(l.price) || 0;
    return '<div class="ln"><div class="ln-main"><div class="ln-name">' + esc(lineLabel(l)) + '</div></div>' +

      (rc ? '<div class="ln-n">' + money(pr) + '</div><div class="ln-n s">' + money(q * pr) + '</div>' : '') +
      '<button type="button" class="ghost ic" data-a="dEditLine" data-i="' + i + '" aria-label="Изменить позицию">' + ico('edit') + '</button></div>';
  }).join('');
}

function rcHtml() {
  if (!D.rcOpen) return '';

  if (!rs.length) return '<div class="sug"><p class="mu" style="margin:0;padding:10px 12px">Поступлений пока нет.</p></div>';
  return '<div class="sug">' + rs.map(function (x) {

function plinesHtml() {

      '<button type="button" class="ghost dg ic" data-a="pDel" data-i="' + i + '" aria-label="Убрать позицию">' + ico('x') + '</button></div>';
  }).join('');
}

function docFoot(T) {
  return '<label style="margin-top:10px">Комментарий' + (T === 'adjust' ? ' (причина, обязательно) *' : '') + '</label>' +

function docBody() {
  var T = D.type, rc = T === 'receipt';
  if (T === 'pricing') {

function shrink(file, cb) {
  var img = new Image(), u = URL.createObjectURL(file);
  img.onload = function () {
    var k = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    var q = 0.8, s = c.toDataURL('image/jpeg', q);
    while (s.length > 40000 && q > 0.3) { q -= 0.1; s = c.toDataURL('image/jpeg', q); }
    cb(s.length > 45000 ? null : s);
  };
  img.onerror = function () { URL.revokeObjectURL(u); cb(null); };
  img.src = u;
}

var DD = null, DB = [], DSEQ = 0;
function ddCopy(l) { return l.map(function (x) { return {id: x.id, type: x.type, name: x.name, extra: x.extra || ''}; }); }
function ddInit() { DD = ddCopy(S.dict); DB = ddCopy(S.dict); }
function ddBase(id) { return DB.filter(function (x) { return x.id === id; })[0]; }
function ddRowChanged(x) { var b = ddBase(x.id); return !b || b.name !== x.name || b.extra !== x.extra; }
function ddDiff() {
  var ch = {add: [], rename: [], extra: [], del: []}, have = {};
  DD.forEach(function (x) {
    have[x.id] = 1;
    var b = ddBase(x.id);
    if (!b) ch.add.push({type: x.type, name: x.name, extra: x.extra});
    else {
      if (b.name !== x.name) ch.rename.push({id: x.id, name: x.name});
      if (b.extra !== x.extra) ch.extra.push({id: x.id, extra: x.extra});
    }
  });
  DB.forEach(function (b) { if (!have[b.id]) ch.del.push(b.id); });
  return ch;
}
function ddDirty() {
  if (!DD) return false;
  var c = ddDiff();
  return !!(c.add.length || c.rename.length || c.extra.length || c.del.length);
}
function ddSync() {
  var b = document.getElementById('dsave'), h = document.getElementById('dhint'), on = ddDirty();

}
function ddDup(type, name, exceptId) {

  aArc: function () { S.aa = S.aa ? 0 : 1; render(); },
  newAd: function () { adForm(null); },
  editAd: function (d) { var a = S.ads.filter(function (x) { return x.id === d.id; })[0]; if (a) adForm(a); },
  arcAd: function (d) { bcall('ads.archive', {id: d.id}).then(aDone).catch(function (e) { toast(e.message); }); },
  resAd: function (d) { bcall('ads.restore', {id: d.id}).then(aDone).catch(function (e) { toast(e.message); }); },
  delAd: function (d) {
    var a = S.ads.filter(function (x) { return x.id === d.id; })[0]; if (!a) return;
    confirmDel('Запись «' + esc(a.name) + '» будет удалена навсегда. Это действие нельзя отменить.', function () {
      return call('ads.delete', {id: a.id}).then(aDone);
    });
  },
  backupNow: function () {
    call('backup.now').then(function (j) { S.info.backup = j.backup; toast('Копия создана: ' + j.name); render(); }).catch(function (e) { toast(e.message); });
  },
  df: function (d) { S.df = d.k; render(); },
  newDoc: function (d) {
    document.querySelectorAll('details.menu[open]').forEach(function (m) { m.open = false; });
    if (d.t !== 'receipt' && !S.products.some(function (p) { return !p.archived; })) return toast('Сначала добавьте товар в разделе «Склад»');
    D = d.t === 'pricing'
      ? {type: 'pricing', plines: [], cm: '', q: '', rcOpen: false, err: ''}
      : {type: d.t, lines: [], sup: '', rs: '', cm: '', q: '', pid: '', vid: '', qty: '', price: '', err: ''};
    docDlg();
  },
  dPickBtn: function () {
    S.btn = null; if (!D) return;
    var pr = D.type === 'pricing';
    pickOne(S.products.filter(function (p) { return !p.archived && (!pr || !D.plines.some(function (l) { return l.pid === p.id; })); }), (!pr && D.pid) ? '' : D.q, function (id) { (pr ? A.pAdd : A.dPick)({id: id}); });
  },
  dPick: function (d) {
    var p = prod(d.id);
    if (!p) return;
    D.pid = p.id; D.q = p.name; D.vid = ''; D.qty = '';
    D.price = (D.type === 'receipt' && p.cost) ? String(p.cost) : '';
    dfix(); dRedraw();
    var el = dlg().querySelector(needVar(p) ? '[data-p="vid"]' : '[data-p="qty"]');
    if (el) el.focus();
  },
  dNewP: function () {
    var old = S.products.map(function (p) { return p.id; });
    prodForm(null, function (j) {
      S.products = j.items; S.dict = j.dict;
      var np = j.items.filter(function (p) { return old.indexOf(p.id) < 0; })[0];
      if (D && np) { D.pid = np.id; D.q = np.name; D.vid = ''; D.price = ''; dfix(); }
      dRedraw();
    }, D.q);
  },
  dEditP: function () {
    var p = prod(D.pid);
    if (!p) return;
    prodForm(p, function (j) {
      S.products = j.items; S.dict = j.dict;
      var np = D && prod(D.pid);
      if (np) D.q = np.name;
      if (D) { dfix(); dRedraw(); }
    });
  },
  dAddLine: function () {
    var T = D.type, rc = T === 'receipt', p = prod(D.pid), bad = [], er = document.getElementById('dper'), qn = Number(D.qty);
    if (!p) bad.push('q'); else if (needVar(p) && !D.vid) bad.push('vid');
    if (D.qty === '' || !isFinite(qn) || qn < 0 || Math.floor(qn) !== qn || (T !== 'adjust' && qn === 0)) bad.push('qty');
    if (rc && (D.price === '' || !(Number(D.price) >= 0))) bad.push('price');
    if (bad.length) {
      bad.forEach(function (k) { var el = dlg().querySelector('[data-p="' + k + '"]'); if (el) el.classList.add('bad'); });
      er.textContent = !p ? 'Выберите товар из списка подсказок' : 'Заполните выделенные поля';
      return;
    }
    if (D.lines.some(function (l) { return l.vid === D.vid; })) { er.textContent = 'Эта позиция уже в списке: измените ее карандашом'; return; }
    D.lines.push({pid: D.pid, vid: D.vid, qty: D.qty, price: D.price});
    D.q = ''; D.pid = ''; D.vid = ''; D.qty = ''; D.price = '';
    dRedraw();
    var q = dlg().querySelector('[data-p="q"]'); if (q) q.focus();
  },
  dEditLine: function (d) { lineDlg(+d.i); },
  // ценообразование
  pRcToggle: function () { D.rcOpen = !D.rcOpen; document.getElementById('prc').innerHTML = rcHtml(); },
  pRc: function (d) {
    var mine = D;
    docLines(d.id).then(function (lines) {
      if (D !== mine || !dlg()) return;
      var added = 0, skipped = 0;
      lines.forEach(function (l) {
        var p = prod(l.productId);
        if (!p || p.archived) { skipped++; return; }
        if (D.plines.some(function (x) { return x.pid === p.id; })) return;
        D.plines.push({pid: p.id, price: p.price > 0 ? String(p.price) : ''}); added++;
      });
      D.rcOpen = false; dRedraw();
      toast('Добавлено товаров: ' + added + (skipped ? '. Пропущено (удалены или в архиве): ' + skipped : ''));
    }).catch(function (e) { toast(e.message); });
  },
  pAdd: function (d) {
    var p = prod(d.id);
    if (!p || D.plines.some(function (x) { return x.pid === p.id; })) return;
    D.plines.push({pid: p.id, price: p.price > 0 ? String(p.price) : ''}); D.q = '';
    dRedraw();
    var el = dlg().querySelector('[data-pl="' + (D.plines.length - 1) + '"]'); if (el) el.focus();
  },
  pDel: function (d) { D.plines.splice(+d.i, 1); dRedraw(); },
  dClose: function () { dlg().close(); },
  dSave: function () {
    if (D.saving) return;
    var T = D.type, er = document.getElementById('der'), bad = [];
    er.textContent = '';
    var payload;
    if (T === 'pricing') {
      if (!D.plines.length) { er.textContent = 'Добавьте хотя бы один товар'; return; }
      D.plines.forEach(function (l, i) { if (l.price.trim() === '' || !(Number(l.price) >= 0)) bad.push(i); });
      if (bad.length) {
        bad.forEach(function (i) { var el = dlg().querySelector('[data-pl="' + i + '"]'); if (el) el.classList.add('bad'); });
        er.textContent = 'Укажите розничную цену у выделенных товаров'; return;
      }
      payload = {type: T, comment: D.cm, lines: D.plines.map(function (l) { return {productId: l.pid, price: l.price}; })};
    } else {
      if (T === 'receipt' && !D.sup) bad.push('sup');
      if (T === 'writeoff' && !D.rs) bad.push('rs');
      if (T === 'adjust' && !D.cm.trim()) bad.push('cm');
      if (bad.length) {
        bad.forEach(function (k) { var el = dlg().querySelector('[data-h="' + k + '"]'); if (el) el.classList.add('bad'); });
        er.textContent = 'Заполните выделенные поля'; return;
      }
      if (D.pid && D.qty !== '') { er.textContent = 'Товар выбран, но не добавлен в список. Нажмите «Добавить».'; return; }
      if (!D.lines.length) { er.textContent = 'Добавьте хотя бы одну позицию в список'; return; }
      payload = {type: T, supplier: D.sup, reason: D.rs, comment: D.cm,
        lines: D.lines.map(function (l) { return {varId: l.vid, qty: l.qty, price: l.price}; })};
    }
    // окно остается открытым, пока идет проведение, и закрывается после ответа; при ошибке документ откроется заново как был
    var snap = D, el = dlg(), sb = S.btn;
    snap.saving = true;
    if (!sb || !el.contains(sb)) sb = el.querySelector('[data-a="dSave"]');
    el.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    S.btn = sb;
    call('docs.save', payload).then(function (j) {
      D = null; el.close();
      keepLines(j.items); S.docs = j.items; S.products = j.products; S.dict = j.dict; S.df = T; toast('Документ проведен'); render();
    }, function (e) {
      el.dataset.keep = '1'; el.close(); el.remove();
      snap.saving = false; snap.err = e.message; D = snap; docDlg();
    });
  },
  openDoc: function (d) {
    var doc = S.docs.filter(function (x) { return x.id === d.id; })[0];
    if (!doc) return;
    S.btn = null;
    var el = view(DOC[doc.type] + ' №' + doc.num, docHtml(doc, S.dl[d.id]));
    el.id = 'dvdlg';
    var rw = el.querySelector('.rw'); rw.style.justifyContent = 'space-between';
    rw.insertAdjacentHTML('afterbegin', '<button class="ghost dg" data-a="delDoc" data-id="' + esc(doc.id) + '">Удалить</button>');
    if (S.dl[d.id]) return;
    docLines(d.id, true).then(function (ls) {
      var vb = el.querySelector('.vb'); if (vb) vb.innerHTML = docHtml(doc, ls);
    }).catch(function (e) { el.close(); toast(e.message); });
  },
  delDoc: function (d) {
    var x = S.docs.filter(function (z) { return z.id === d.id; })[0]; if (!x) return;
    S.btn = null;
    var notes = {receipt: 'Товар из этого поступления будет убран со склада. Если часть уже продана, списана или лежит в резерве заказа, удалить документ не получится.',
      writeoff: 'Списанный товар вернется на склад.',
      adjust: 'Изменения остатков по этой корректировке будут отменены, если товар еще не использован.',
      pricing: 'Цены товаров останутся прежними: исчезнет только запись о документе.',
      'return': 'Возврат будет отменен: товар, вернувшийся на склад, уберется со склада (если он еще не продан). Заказ снова станет обычным завершенным.'};
    delGate({what: 'документ «' + DOC[x.type] + ' №' + x.num + '»', action: 'docs.delete', id: x.id, note: notes[x.type],
      done: function (j) { var m = document.getElementById('dvdlg'); if (m) m.close(); delete S.dl[x.id]; S.ts = {}; S.sig = {}; keepLines(j.items); S.docs = j.items; S.products = j.products; S.dict = j.dict; render(); toast('Документ удален'); }});
  },
  dt: function (d) { S.dt = d.k; render(); },
  addDict: function () {
    ask('Добавить: ' + DT[S.dt], [{l: 'Название'}], 'Добавить', function (v) {
      var nm = v[0].trim();
      if (!nm) return Promise.reject(new Error('Введите название'));
      if (ddDup(S.dt, nm, '')) return Promise.reject(new Error('Такая запись уже есть'));
      DD.push({id: 'tmp' + (++DSEQ), type: S.dt, name: nm, extra: ''});
      render();
      return Promise.resolve();
    });
  },
  renDict: function (d) {
    var x = DD.filter(function (i) { return i.id === d.id; })[0]; if (!x) return;
    ask('Переименовать', [{l: 'Название', v: x.name}], 'Сохранить', function (v) {
      var nm = v[0].trim();
      if (!nm) return Promise.reject(new Error('Введите название'));
      if (ddDup(x.type, nm, x.id)) return Promise.reject(new Error('Такая запись уже есть'));
      x.name = nm; render();
      return Promise.resolve();
    });
  },
  saveDict: function () {
    if (!ddDirty()) { S.btn = null; return; }
    ddSave().catch(function (e) { toast(e.message); });
  },
  refDict: function () {
    var go = function () {
      return call('dict.list').then(function (j) {
        S.dict = j.items; S.ts = {}; S.sig = {}; ddInit();
        toast('Справочники обновлены'); render();
      });
    };
    if (ddDirty()) {
      S.btn = null;
      confirmAct('Обновить справочники?', 'Несохраненные изменения будут потеряны: список загрузится заново из общей базы.', 'Обновить', 'dg', go);
    } else go().catch(function (e) { toast(e.message); });
  },
  delDict: function (d) {
    var x = DD.filter(function (i) { return i.id === d.id; })[0]; if (!x) return;
    S.btn = null;
    confirmAct('Удалить запись?', 'Запись «' + esc(x.name) + '» будет удалена после нажатия на «Сохранить».', 'Удалить', 'dg', function () {
      DD = DD.filter(function (i) { return i.id !== x.id; }); render();
      return Promise.resolve();
    });
  },
  theme: function () {
    S.btn = null;
    var t = themeNow() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
    document.querySelectorAll('[data-a="theme"]').forEach(function (b) { b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); });
  },
  lang: function (d) { S.btn = null; document.querySelectorAll('details.menu[open]').forEach(function (m) { m.open = false; }); setLang(d.l === 'uk' ? 'uk' : 'ru'); },
  // «Обновить» на главной: заново загружает главную и сбрасывает кэш всех разделов, чтобы везде были актуальные данные
  refHome: function () {
    var others = Object.keys(LOADS).filter(function (pg) { return pg !== 'home' && S.ld[LOADS[pg][1]]; });
    S.ts = {}; S.sig = {};
    call('home.get', null, false, true).then(function (j) {
      S.home = j; if (j.plist && j.plist.length) S.plist = j.plist; S.ld.home = 1; S.ts.home = Date.now();
      if (S.page === 'home') render();
      others.forEach(function (pg) { load(pg); });
      toast('Данные обновлены');
    }).catch(function (e) { toast(e.message); });
  },
  copyApi: function () { copy(url(), 'Ссылка скопирована'); },
  copyInfo: function () { copy(diag(), 'Диагностика скопирована'); }
};

function closeMore() {
  var m = document.querySelector('.more');
  if (!m) { S.more = false; return render(); }
  m.classList.add('out');
  setTimeout(function () { S.more = false; render(); }, 140);
}
function closeMenus(e) {
  document.querySelectorAll('details.menu[open]').forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
}
document.addEventListener('pointerdown', closeMenus, true);
document.addEventListener('touchstart', closeMenus, {capture: true, passive: true});
document.addEventListener('click', function (e) {
  document.querySelectorAll('details.menu[open]').forEach(function (m) { if (!m.contains(e.target)) m.open = false; });
  if (S.more && !e.target.closest('.more') && !e.target.closest('[data-a="more"]')) closeMore();
  if (D && D.rcOpen && !e.target.closest('.rcbox')) { D.rcOpen = false; var pr = document.getElementById('prc'); if (pr) pr.innerHTML = ''; }
  var b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) {
    var mm = b.closest('details.menu');
    if (mm) mm.open = false;
    S.btn = b; A[b.dataset.a](b.dataset);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && /^(pw|lg|nm|api|rn|rl|rp|rp2)$/.test(e.target.id)) {
    var b = document.querySelector('.pri[data-a]'); if (b) b.click();
  }
});

document.addEventListener('change', function (e) {
  if (e.target.id !== 'srt' && e.target.id !== 'srt2') return;
  S.sort = e.target.value; localStorage.setItem('sort', S.sort);
  if (e.target.id === 'srt2') { render(); if (S.fd) S.fd.paint(); } else { document.getElementById('plist').innerHTML = plist(); syncReset(); }
});
document.addEventListener('input', dSync);
document.addEventListener('change', dSync);
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; document.getElementById('plist').innerHTML = plist(); }
});

document.addEventListener('input', oSync);
document.addEventListener('change', oSync);
document.addEventListener('input', function (e) {
  if (e.target.id === 'cq') { S.cq = e.target.value; document.getElementById('clist').innerHTML = clist(); }
  if (e.target.id === 'oq') { S.oq = e.target.value; document.getElementById('olist').innerHTML = olist(); }
});

// ТТН: только цифры, счетчик символов, Enter сохраняет
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t.classList || !t.classList.contains('ttn-i')) return;
  var o = ord(t.dataset.ttn), len = o ? oTtnLen(o) : 14, box = t.closest('.ttn');
  var v = t.value.replace(/\D/g, '').slice(0, len);
  if (t.value !== v) t.value = v;
  box.querySelector('.ttn-e').textContent = '';
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && O && e.target.dataset && e.target.dataset.o === 'eq') { e.preventDefault(); S.btn = null; A.oLineOk(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('ttn-i')) {
    e.preventDefault(); S.btn = null; A.ttnSave({id: e.target.dataset.ttn});
  }
});

init();
</script>
</body>
</html>
